<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'">
  <title>Prompt Predictor</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-main">
        <div class="title-group">
          <h1 class="title">Prompt Predictor</h1>
          <span id="status-pill" class="status-pill" data-state="idle">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">初始化…</span>
          </span>
          <span id="latency-badge" class="latency-badge hidden"></span>
        </div>
        <div class="header-actions">
          <button id="btn-refresh" type="button" class="icon-btn" title="重新生成预测" aria-label="重新生成预测">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.6"/>
              <path d="M13.5 2.5v2.9h-2.9"/>
            </svg>
          </button>
          <button id="btn-settings" type="button" class="icon-btn" title="模型与 Key 设置" aria-label="模型与 Key 设置" aria-expanded="false" aria-controls="settings-drawer">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="8" r="2.2"/>
              <path d="M13.2 8a5.2 5.2 0 0 0-.08-.9l1.4-1.08-1.2-2.08-1.66.66a5.3 5.3 0 0 0-1.56-.9L9.84 2h-2.4l-.26 1.7a5.3 5.3 0 0 0-1.56.9l-1.66-.66-1.2 2.08 1.4 1.08a5.2 5.2 0 0 0 0 1.8l-1.4 1.08 1.2 2.08 1.66-.66c.48.39 1 .7 1.56.9l.26 1.7h2.4l.26-1.7c.56-.2 1.08-.51 1.56-.9l1.66.66 1.2-2.08-1.4-1.08c.05-.3.08-.6.08-.9z"/>
            </svg>
          </button>
        </div>
      </div>
      <p id="sub-meta" class="sub-meta hidden"></p>
    </header>

    <section id="settings-drawer" class="settings-drawer hidden" aria-label="模型配置">
      <div class="drawer-head">
        <span class="drawer-title">模型与 API 配置</span>
        <button id="btn-close-settings" type="button" class="text-btn">收起</button>
      </div>

      <div class="presets" role="group" aria-label="常用提供商预设">
        <button type="button" class="preset-btn" data-preset="openai">OpenAI</button>
        <button type="button" class="preset-btn" data-preset="gemini">Gemini</button>
        <button type="button" class="preset-btn" data-preset="deepseek">DeepSeek</button>
        <button type="button" class="preset-btn" data-preset="ark">火山方舟/豆包</button>
        <button type="button" class="preset-btn" data-preset="ollama">Ollama 本地</button>
      </div>

      <form id="settings-form" class="settings-form" autocomplete="off">
        <div class="field-row">
          <label class="field">
            <span class="field-label">Provider</span>
            <select id="cfg-provider" name="provider">
              <option value="openai-compatible">OpenAI 兼容</option>
              <option value="gemini">Google Gemini</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Model</span>
            <input id="cfg-model" name="model" type="text" placeholder="gpt-4o-mini" required>
          </label>
        </div>

        <label class="field">
          <span class="field-label">Base URL</span>
          <input id="cfg-baseurl" name="baseUrl" type="url" placeholder="https://api.openai.com/v1" required>
        </label>

        <label class="field">
          <span class="field-label">API Key</span>
          <input id="cfg-apikey" name="apiKey" type="password" placeholder="输入 API Key" autocomplete="new-password">
        </label>

        <label class="field">
          <span class="field-label">预测风格提示（可选）</span>
          <input id="cfg-instructions" name="customInstructions" type="text" maxlength="500" placeholder="例如：偏重排查问题或直接推进下一步">
        </label>

        <label class="checkbox-field">
          <input id="cfg-autopredict" name="autoPredict" type="checkbox">
          <span>每轮回复结束后自动预测（会将最近最多 6 条对话发送至上方 Base URL，仅过滤部分常见密钥格式）</span>
        </label>

        <div id="settings-feedback" class="feedback hidden" role="status"></div>

        <div class="drawer-actions">
          <button id="btn-test" type="button" class="btn secondary">Test</button>
          <button id="btn-save" type="submit" class="btn primary">Save</button>
          <button id="btn-clear-key" type="button" class="btn danger-ghost">Clear Key</button>
        </div>

        <p id="cfg-path" class="cfg-path"></p>
      </form>
    </section>

    <main class="main">
      <div id="error-banner" class="error-banner hidden" role="alert"></div>
      <div id="empty-state" class="empty-state">
        <p id="empty-title" class="empty-title">等待对话轮次结束</p>
        <p id="empty-desc" class="empty-desc">配置好模型 Key 后，AI 每次回复结束会自动预测接下来最可能发送的提示词。</p>
      </div>
      <div id="suggestions-list" class="suggestions-list" aria-live="polite"></div>
    </main>

    <footer class="composer-dock">
      <div class="composer-box">
        <div id="ghost-overlay" class="ghost-overlay" aria-hidden="true"></div>
        <textarea
          id="composer-input"
          class="composer-input"
          rows="2"
          placeholder="输入消息，或按 Tab 采纳灰字预测 (Enter 发送)"
          aria-label="Quick Composer"
        ></textarea>
      </div>
      <div class="composer-bar">
        <span id="composer-hint" class="composer-hint">Tab 采纳 · ↑↓ 切换 · Enter 发送</span>
        <div class="composer-right">
          <span id="send-status" class="send-status hidden"></span>
          <button id="btn-send-composer" type="button" class="btn primary sm">发送</button>
        </div>
      </div>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
